name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/michal-cecko/stride-workout-app:latest
            ghcr.io/michal-cecko/stride-workout-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Pin stride-web-app to the new image and deploy
        env:
          API: ${{ secrets.DOKPLOY_URL }}
          KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP: CrTYx3TPARXrWIloZqnQ1
          IMG: ghcr.io/michal-cecko/stride-workout-app:sha-${{ github.sha }}
        run: |
          set -e
          curl -sf -X POST -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP\",\"dockerImage\":\"$IMG\"}" \
            "$API/api/application.update" > /dev/null
          curl -sf -X POST -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP\"}" \
            "$API/api/application.deploy" > /dev/null
          echo "deployed $APP -> $IMG"
